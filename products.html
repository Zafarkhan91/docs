<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>हमारे प्रोडक्ट्स - मेरा स्टोर</title>
    <!-- वही CSS फ़ाइल जो हमने होम पेज के लिए इस्तेमाल की थी -->
    <link rel="stylesheet" href="style.css">
    <!-- फॉन्ट ऑसम आइकन्स -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>

    <!-- ==================== हेडर सेक्शन (होम पेज जैसा ही) ==================== -->
    <header>
        <div class="container">
            <a href="index.html" class="logo">मेरा स्टोर</a>
            <nav>
                <ul>
                    <li><a href="index.html">होम</a></li>
                    <li><a href="products.html">प्रोडक्ट्स</a></li>
                    <li><a href="cart.html">कार्ट <i class="fas fa-shopping-cart"></i></a></li>
                </ul>
            </nav>
        </div>
    </header>

    <!-- ==================== मुख्य कंटेंट सेक्शन ==================== -->
    <main>
        <!-- प्रोडक्ट्स पेज का मुख्य सेक्शन -->
        <section class="products-page">
            <div class="container">
                <h2>सभी प्रोडक्ट्स</h2>

                <!-- प्रोडक्ट्स का ग्रिड -->
                <!-- यह div खाली रहेगा। हम JavaScript का उपयोग करके इसमें सभी प्रोडक्ट्स को डायनामिक रूप से भरेंगे। -->
                <div id="product-list" class="product-grid">
                    <!-- प्रोडक्ट कार्ड्स यहाँ JavaScript द्वारा डाले जाएंगे -->
                    <!-- उदाहरण के लिए एक कार्ड ऐसा दिखेगा:
                    <div class="product-card">
                        <img src="https://placehold.co/300x300/eee/ccc?text=Product" alt="प्रोडक्ट">
                        <h3>प्रोडक्ट का नाम</h3>
                        <p>₹कीमत</p>
                        <button class="btn add-to-cart-btn" data-id="1">कार्ट में जोड़ें</button>
                    </div>
                    -->
                </div>
            </div>
        </section>
    </main>

    <!-- ==================== फुटर सेक्शन (होम पेज जैसा ही) ==================== -->
    <footer>
        <div class="container">
            <p>&copy; 2024 मेरा स्टोर. सभी अधिकार सुरक्षित।</p>
        </div>
    </footer>

    <!-- जावास्क्रिप्ट फ़ाइल -->
    <!-- ध्यान दें कि हम वही script.js फ़ाइल इस्तेमाल कर रहे हैं। -->
    <script src="script.js"></script>
</body>
</html>
