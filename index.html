<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>मौसम ऐप</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="card">
        <div class="search">
            <input type="text" placeholder="शहर का नाम लिखें" spellcheck="false">
            <button><img src="https://placehold.co/16x16/000/fff?text=🔍" alt="Search"></button>
        </div>
        <div class="error" style="display: none;">
            <p>अमान्य शहर का नाम</p>
        </div>
        <div class="weather">
            <img src="https://placehold.co/170x170/fff/333?text=☀️" class="weather-icon">
            <h1 class="temp">22°c</h1>
            <h2 class="city">New York</h2>
            <div class="details">
                <div class="col">
                    <img src="https://placehold.co/40x40/fff/333?text=💧">
                    <div>
                        <p class="humidity">50%</p>
                        <p>नमी</p>
                    </div>
                </div>
                <div class="col">
                    <img src="https://placehold.co/40x40/fff/333?text=💨">
                    <div>
                        <p class="wind">15 km/h</p>
                        <p>हवा की गति</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
