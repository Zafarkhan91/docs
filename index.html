<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>मेरी टू-डू लिस्ट</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="todo-app">
            <h2>मेरी टू-डू लिस्ट</h2>
            <div class="row">
                <input type="text" id="input-box" placeholder="यहाँ अपना टास्क लिखें">
                <button onclick="addTask()">जोड़ें</button>
            </div>
            <ul id="list-container">
                <!-- Tasks will be added here by JavaScript -->
            </ul>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
