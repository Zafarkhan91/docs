<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>आपका कार्ट - मेरा स्टोर</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>

    <!-- ==================== हेडर सेक्शन (बाकी पेजों जैसा ही) ==================== -->
    <header>
        <div class="container">
            <a href="index.html" class="logo">मेरा स्टोर</a>
            <nav>
                <ul>
                    <li><a href="index.html">होम</a></li>
                    <li><a href="products.html">प्रोडक्ट्स</a></li>
                    <li><a href="cart.html">कार्ट <i class="fas fa-shopping-cart"></i></a></li>
                </ul>
            </nav>
        </div>
    </header>

    <!-- ==================== मुख्य कंटेंट सेक्शन ==================== -->
    <main>
        <section class="cart-page">
            <div class="container">
                <h2>आपका शॉपिंग कार्ट</h2>

                <!-- कार्ट आइटम्स का कंटेनर -->
                <!-- यह div खाली रहेगा। हम JavaScript का उपयोग करके इसमें कार्ट के आइटम्स को भरेंगे। -->
                <div id="cart-items-container">
                    <!-- कार्ट आइटम यहाँ JavaScript द्वारा डाले जाएंगे -->
                    <!-- उदाहरण के लिए एक आइटम ऐसा दिखेगा:
                    <div class="cart-item">
                        <img src="https://placehold.co/100x100" alt="प्रोडक्ट">
                        <div class="item-details">
                            <h3>प्रोडक्ट का नाम</h3>
                            <p>₹कीमत</p>
                        </div>
                        <div class="item-quantity">
                            <input type="number" value="1" min="1">
                        </div>
                        <div class="item-total">
                            <p>₹कुल</p>
                        </div>
                        <button class="remove-btn" data-id="1">हटाएं</button>
                    </div>
                    -->
                </div>

                <!-- कार्ट का टोटल सेक्शन -->
                <div id="cart-total" class="cart-summary">
                    <h3>कार्ट का सारांश</h3>
                    <p>कुल कीमत: <span id="total-price">₹0</span></p>
                    <button class="btn">चेकआउट</button>
                </div>
            </div>
        </section>
    </main>

    <!-- ==================== फुटर सेक्शन (बाकी पेजों जैसा ही) ==================== -->
    <footer>
        <div class="container">
            <p>&copy; 2024 मेरा स्टोर. सभी अधिकार सुरक्षित।</p>
        </div>
    </footer>

    <!-- जावास्क्रिप्ट फ़ाइल -->
    <script src="script.js"></script>
</body>
</html>
